<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Pro - Enterprise Supermarket SaaS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @media print {
            body * { visibility: hidden; }
            #printableArea, #printableArea * { visibility: visible; }
            #printableArea { position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans">
    <div id="app"></div>

    <script>
        function getMarketProLogo(size = "w-10 h-10") {
            return `
                <svg class="${size} shrink-0" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="mpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#0D9488" />
                            <stop offset="100%" stop-color="#4F46E5" />
                        </linearGradient>
                    </defs>
                    <rect width="64" height="64" rx="16" fill="url(#mpGrad)"/>
                    <path d="M24 22V18C24 13.5817 27.5817 10 32 10C36.4183 10 40 13.5817 40 18V22" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
                    <path d="M16 22H48L45.5 48C45.2 50.8 42.8 53 40 53H24C21.2 53 18.8 50.8 18.5 48L16 22Z" fill="white" fill-opacity="0.18" stroke="white" stroke-width="3" stroke-linejoin="round"/>
                    <path d="M23 41V31L32 38L41 31V41" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="48" cy="16" r="4" fill="#FBBF24"/>
                </svg>
            `;
        }

        let state = {
            view: 'login',
            activeTab: 'stores',
            currentUser: null,
            isSuperAdmin: false,
            activeStore: null,
            currency: '₹',
            language: 'English',
            
            usernameInput: '',
            passwordInput: '',
            superAdminUser: 'IRFAAN',
            superAdminPass: 'irfaan@201223',
            
            storesList: JSON.parse(localStorage.getItem('mp_flow_stores') || '[]'),
            newStoreName: '', newStoreLogo: '', newStoreLocation: '', newStoreOwner: '', newStoreNo: '', newStoreWhatsapp: '', newStoreUser: '', newStorePass: '',

            products: JSON.parse(localStorage.getItem('mp_flow_prods') || 'null') || [
                { id: 1, barcode: '890101', name: 'Arokya Full Cream Milk 1L', mrp: 78, price: 71.40, stock: 50, category: 'Dairy', image: '🥛' },
                { id: 2, barcode: '890102', name: 'Tamil Milk 500ml', mrp: 32, price: 29.50, stock: 45, category: 'Dairy', image: '🥛' },
                { id: 3, barcode: '890103', name: 'Basmati Rice Premium 5kg', mrp: 620, price: 550.00, stock: 20, category: 'Grains', image: '🌾' }
            ],

            orders: JSON.parse(localStorage.getItem('mp_flow_orders') || 'null') || [
                { id: 101, customer: 'Kumar', phone: '9876543210', item: 'Arokya Full Cream Milk 1L', price: 71.40, qty: 2, total: 142.80, status: 'Pending', reason: '', deliveryBoy: 'Ramesh (9811223344)' }
            ],

            posCart: [],
            customerPhone: '', customerName: '', deliveryBoyInput: '',
            cancellingOrderId: null, invoiceOrder: null,
            newItem: { barcode: '', name: '', mrp: '', price: '', image: '🛒' },

            flyerTemplateId: 1,
            flyerThemeColor: '#DC2626',
            flyerTitle: 'MEGA WEEKEND HYPERMARKET FESTIVAL',
            flyerSubtitle: 'Fresh Dairy & Groceries at Unbeatable Prices',
            flyerFormat: 'A4'
        };

        function saveData() {
            localStorage.setItem('mp_flow_stores', JSON.stringify(state.storesList));
            localStorage.setItem('mp_flow_prods', JSON.stringify(state.products));
            localStorage.setItem('mp_flow_orders', JSON.stringify(state.orders));
        }

        function render() {
            const app = document.getElementById('app');
            app.innerHTML = '';
            if (state.view === 'login') app.innerHTML = renderLogin();
            else if (state.view === 'dashboard') app.innerHTML = renderDashboard();
            else if (state.view === 'customer') app.innerHTML = renderCustomerStore();
            try { lucide.createIcons(); } catch(e){}
        }

        function renderLogin() {
            return `
                <div class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-100 via-teal-50 to-indigo-50">
                    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border">
                        <div class="text-center mb-6">${getMarketProLogo("w-14 h-14 mx-auto mb-2")}
                            <h1 class="text-2xl font-extrabold text-slate-900">Market <span class="text-teal-600">Pro</span></h1>
                            <p class="text-xs text-slate-500">Enterprise Supermarket SaaS Platform</p>
                        </div>
                        <div class="space-y-4">
                            <div><label class="block text-xs font-bold uppercase text-slate-600 mb-1">Username</label><input type="text" value="${state.usernameInput}" oninput="state.usernameInput=this.value" placeholder="IRFAAN" class="w-full px-4 py-2 border rounded-lg text-xs"></div>
                            <div><label class="block text-xs font-bold uppercase text-slate-600 mb-1">Password</label><input type="password" value="${state.passwordInput}" oninput="state.passwordInput=this.value" placeholder="Password" class="w-full px-4 py-2 border rounded-lg text-xs"></div>
                            <button onclick="handleLogin()" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-2.5 rounded-lg text-xs">Sign In</button>
                        </div>
                        <div class="mt-6 pt-4 border-t text-center">
                            <button onclick="switchView('customer')" class="text-emerald-700 font-bold text-xs">Open Customer Online Store →</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function handleLogin() {
            if (state.usernameInput === state.superAdminUser && state.passwordInput === state.superAdminPass) {
                state.currentUser = 'IRFAAN (Admin)'; state.isSuperAdmin = true; state.view = 'dashboard'; state.activeTab = 'stores'; render(); return;
            }
            const match = state.storesList.find(s => s.user === state.usernameInput && s.pass === state.passwordInput);
            if (match) {
                state.currentUser = match.name; state.activeStore = match; state.view = 'dashboard'; state.activeTab = 'pos'; render(); return;
            }
            alert('Invalid Login! Use IRFAAN / irfaan@201223');
        }

        function renderDashboard() {
            const workspaceName = state.activeStore ? state.activeStore.name : 'Master Admin Workspace';
            return `
                <div class="min-h-screen flex flex-col bg-slate-100">
                    <header class="bg-white shadow-sm border-b px-6 py-3 flex flex-wrap justify-between items-center gap-4">
                        <div class="flex items-center space-x-3">
                            ${getMarketProLogo("w-10 h-10")}
                            <div><h2 class="text-base font-extrabold text-slate-900">${workspaceName}</h2><p class="text-xs text-slate-500">User: <span class="font-bold text-teal-600">${state.currentUser}</span></p></div>
                        </div>
                        <div class="flex items-center space-x-2">
                            <!-- All Currencies -->
                            <select onchange="state.currency=this.value; render();" class="border rounded px-2 py-1 text-xs font-bold bg-slate-50">
                                <option value="₹" ${state.currency==='₹'?'selected':''}>INR (₹)</option>
                                <option value="$" ${state.currency==='$'?'selected':''}>USD ($)</option>
                                <option value="OMR " ${state.currency==='OMR '?'selected':''}>OMR (ر.ع.)</option>
                                <option value="AED " ${state.currency==='AED '?'selected':''}>AED (د.إ)</option>
                                <option value="SAR " ${state.currency==='SAR '?'selected':''}>SAR (ر.س)</option>
                                <option value="EUR " ${state.currency==='EUR '?'selected':''}>EUR (€)</option>
                                <option value="GBP " ${state.currency==='GBP '?'selected':''}>GBP (£)</option>
                            </select>
                            <!-- All Languages -->
                            <select onchange="state.language=this.value; render();" class="border rounded px-2 py-1 text-xs font-bold bg-slate-50">
                                <option value="English" ${state.language==='English'?'selected':''}>English</option>
                                <option value="Tamil" ${state.language==='Tamil'?'selected':''}>தமிழ்</option>
                                <option value="Arabic" ${state.language==='Arabic'?'selected':''}>العربية</option>
                                <option value="Hindi" ${state.language==='Hindi'?'selected':''}>हिन्दी</option>
                            </select>
                            <button onclick="switchView('customer')" class="bg-emerald-50 text-emerald-700 px-3 py-1.5 rounded text-xs font-bold">Customer Store</button>
                            <button onclick="logout()" class="text-red-600 border border-red-200 px-3 py-1.5 rounded text-xs font-bold">Logout</button>
                        </div>
                    </header>

                    <!-- Flowchart Nav Tabs -->
                    <div class="bg-white border-b px-6 py-2.5 flex space-x-2 overflow-x-auto text-xs font-bold">
                        ${state.isSuperAdmin && !state.activeStore ? `<button onclick="state.activeTab='stores'; render();" class="px-3 py-2 rounded ${state.activeTab==='stores'?'bg-teal-700 text-white':'text-slate-600'}">Client Stores (${state.storesList.length})</button>` : ''}
                        <button onclick="state.activeTab='pos'; render();" class="px-3 py-2 rounded ${state.activeTab==='pos'?'bg-teal-700 text-white':'text-slate-600'}">POS Counter Billing</button>
                        <button onclick="state.activeTab='inventory'; render();" class="px-3 py-2 rounded ${state.activeTab==='inventory'?'bg-teal-700 text-white':'text-slate-600'}">Inventory & CSV/Image Sync</button>
                        <button onclick="state.activeTab='orders'; render();" class="px-3 py-2 rounded ${state.activeTab==='orders'?'bg-teal-700 text-white':'text-slate-600'}">Online Orders & PDF Bill</button>
                        <button onclick="state.activeTab='flyer'; render();" class="px-3 py-2 rounded ${state.activeTab==='flyer'?'bg-teal-700 text-white':'text-slate-600'}">Offer Flyers (1500+ Templates)</button>
                        <button onclick="state.activeTab='pricetags'; render();" class="px-3 py-2 rounded ${state.activeTab==='pricetags'?'bg-teal-700 text-white':'text-slate-600'}">Shelf Price Tags & Barcodes</button>
                        <button onclick="state.activeTab='wholesale'; render();" class="px-3 py-2 rounded ${state.activeTab==='wholesale'?'bg-teal-700 text-white':'text-slate-600'}">Wholesale & Expiry</button>
                    </div>

                    <main class="flex-1 p-6 max-w-7xl mx-auto w-full">
                        ${state.activeTab === 'stores' ? renderStoresTab() : ''}
                        ${state.activeTab === 'pos' ? renderPOSTab() : ''}
                        ${state.activeTab === 'inventory' ? renderInventoryTab() : ''}
                        ${state.activeTab === 'orders' ? renderOrdersTab() : ''}
                        ${state.activeTab === 'flyer' ? renderFlyerTab() : ''}
                        ${state.activeTab === 'pricetags' ? renderPriceTagsTab() : ''}
                        ${state.activeTab === 'wholesale' ? renderWholesaleTab() : ''}
                    </main>
                </div>
                ${state.cancellingOrderId !== null ? renderCancelModal() : ''}
                ${state.invoiceOrder !== null ? renderPDFModal() : ''}
            `;
        }

        // --- 1. CLIENT STORE ---
        function renderStoresTab() {
            return `
                <div class="space-y-6">
                    <div class="bg-white p-6 rounded-xl border space-y-4">
                        <h3 class="font-bold text-sm text-slate-800">Create Client Store (Shop Name, Logo, Location, Owner Name, Shop Number, WhatsApp Number)</h3>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                            <input type="text" value="${state.newStoreName}" oninput="state.newStoreName=this.value" placeholder="Shop Name" class="border p-2 rounded text-xs">
                            <input type="text" value="${state.newStoreLogo}" oninput="state.newStoreLogo=this.value" placeholder="Logo Emoji/URL" class="border p-2 rounded text-xs">
                            <input type="text" value="${state.newStoreLocation}" oninput="state.newStoreLocation=this.value" placeholder="Shop Location" class="border p-2 rounded text-xs">
                            <input type="text" value="${state.newStoreOwner}" oninput="state.newStoreOwner=this.value" placeholder="Shop Owner Name" class="border p-2 rounded text-xs">
                            <input type="text" value="${state.newStoreNo}" oninput="state.newStoreNo=this.value" placeholder="Shop Number" class="border p-2 rounded text-xs">
                            <input type="text" value="${state.newStoreWhatsapp}" oninput="state.newStoreWhatsapp=this.value" placeholder="WhatsApp Number" class="border p-2 rounded text-xs">
                            <input type="text" value="${state.newStoreUser}" oninput="state.newStoreUser=this.value" placeholder="Client Username" class="border p-2 rounded text-xs">
                            <input type="text" value="${state.newStorePass}" oninput="state.newStorePass=this.value" placeholder="Password" class="border p-2 rounded text-xs">
                        </div>
                        <button onclick="createStore()" class="bg-teal-700 text-white px-5 py-2 rounded text-xs font-bold">Create Client Store</button>
                    </div>
                    <div class="bg-white p-6 rounded-xl border">
                        <h3 class="font-bold text-sm text-slate-800 mb-3">Registered Client Stores</h3>
                        <table class="w-full text-left text-xs">
                            <thead><tr class="border-b bg-slate-50"><th class="p-2">Logo & Name</th><th class="p-2">Owner & Location</th><th class="p-2">Shop # / WhatsApp</th><th class="p-2">Login ID</th><th class="p-2 text-right">Action</th></tr></thead>
                            <tbody>
                                ${state.storesList.length===0?`<tr><td colspan="5" class="p-4 text-center text-slate-400">No stores created yet.</td></tr>`:''}
                                ${state.storesList.map(s=>`
                                    <tr class="border-b"><td class="p-2 font-bold">${s.logo||'🏬'} ${s.name}</td><td class="p-2">${s.owner||''} (${s.location||''})</td><td class="p-2">${s.shopNo||''} / ${s.whatsapp||''}</td><td class="p-2 text-teal-700">${s.user}/${s.pass}</td><td class="p-2 text-right"><button onclick="state.activeStore=s; state.currentUser=s.name; state.activeTab='pos'; render();" class="bg-teal-700 text-white px-2.5 py-1 rounded">Open</button> <button onclick="state.storesList=state.storesList.filter(x=>x.id!==${s.id}); saveData(); render();" class="text-red-500 font-bold">Delete</button></td></tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        // --- 2. POS COUNTER ---
        function renderPOSTab() {
            const subtotal = state.posCart.reduce((s,i)=>s+(i.price*i.qty),0);
            return `
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="lg:col-span-2 space-y-4">
                        <div class="bg-white p-4 rounded-xl border flex gap-3">
                            <input type="text" placeholder="Scan barcode or search items..." class="flex-1 border p-2 rounded text-xs outline-none">
                            <button onclick="alert('Camera Barcode Scanner Ready!')" class="bg-teal-700 text-white px-3 py-2 rounded text-xs font-bold">Cam Scan</button>
                        </div>
                        <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                            ${state.products.map(p=>`
                                <div onclick="addPOS(${p.id})" class="bg-white border rounded-xl p-3 cursor-pointer hover:border-teal-600 shadow-xs flex flex-col justify-between">
                                    <div class="flex justify-between items-start"><div><span class="text-2xl">${p.image||'📦'}</span><h4 class="font-bold text-xs mt-1">${p.name}</h4></div></div>
                                    <div class="mt-3 flex justify-between items-end"><span class="text-sm font-black text-teal-700">${state.currency}${p.price}</span><span class="bg-teal-50 text-teal-700 px-2 py-0.5 rounded text-[10px] font-bold">+ Add</span></div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    <div class="bg-white rounded-xl border p-4 space-y-3 h-fit text-xs">
                        <h3 class="font-bold border-b pb-2">POS Counter Bill</h3>
                        <input type="text" value="${state.customerName}" oninput="state.customerName=this.value" placeholder="Customer Name" class="w-full border p-2 rounded">
                        <input type="text" value="${state.customerPhone}" oninput="state.customerPhone=this.value" placeholder="Customer Phone" class="w-full border p-2 rounded">
                        <div class="space-y-1 max-h-40 overflow-y-auto divide-y">
                            ${state.posCart.map(i=>`<div class="py-1 flex justify-between"><span>${i.image||''} ${i.name} (x${i.qty})</span><span class="font-bold">${state.currency}${i.price*i.qty}</span></div>`).join('')}
                        </div>
                        <div class="border-t pt-2 font-black text-sm flex justify-between"><span>Total:</span><span>${state.currency}${subtotal.toFixed(2)}</span></div>
                        <button onclick="completePOS()" class="w-full bg-teal-700 text-white font-bold py-2.5 rounded shadow">Complete Bill & Print</button>
                    </div>
                </div>
            `;
        }

        // --- 3. INVENTORY & CSV/IMAGE SYNC ---
        function renderInventoryTab() {
            return `
                <div class="bg-white p-6 rounded-xl border space-y-6">
                    <div class="flex justify-between items-center">
                        <h3 class="font-bold text-sm text-slate-800">Inventory Catalog with Image, Qty, Price & CSV/PDF Upload</h3>
                        <div class="space-x-2">
                            <button onclick="downloadCSV()" class="bg-emerald-600 text-white px-3 py-1.5 rounded text-xs font-bold">Download CSV Template</button>
                            <input type="file" id="csvFile" accept=".csv" class="text-xs inline-block" onchange="uploadCSV(this)">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 md:grid-cols-6 gap-3 bg-slate-50 p-4 rounded-lg border">
                        <input type="text" value="${state.newItem.barcode}" oninput="state.newItem.barcode=this.value" placeholder="Barcode" class="border p-2 rounded text-xs">
                        <input type="text" value="${state.newItem.name}" oninput="state.newItem.name=this.value" placeholder="Item Name" class="border p-2 rounded text-xs md:col-span-2">
                        <input type="text" value="${state.newItem.image}" oninput="state.newItem.image=this.value" placeholder="Emoji/Image" class="border p-2 rounded text-xs">
                        <input type="number" value="${state.newItem.price}" oninput="state.newItem.price=this.value" placeholder="Price" class="border p-2 rounded text-xs">
                        <button onclick="addManualItem()" class="bg-teal-700 text-white font-bold rounded text-xs">+ Add Item</button>
                    </div>
                    <table class="w-full text-left text-xs">
                        <thead><tr class="border-b bg-slate-50"><th class="p-2">Image</th><th class="p-2">Barcode</th><th class="p-2">Name</th><th class="p-2">Stock Qty</th><th class="p-2">Price</th><th class="p-2 text-right">Action</th></tr></thead>
                        <tbody>
                            ${state.products.map(p=>`
                                <tr class="border-b"><td class="p-2 text-lg">${p.image||'📦'}</td><td class="p-2 font-mono">${p.barcode}</td><td class="p-2 font-bold">${p.name}</td><td class="p-2">${p.stock}</td><td class="p-2 text-teal-700 font-bold">${state.currency}${p.price}</td><td class="p-2 text-right"><button onclick="state.products=state.products.filter(x=>x.id!==${p.id}); saveData(); render();" class="text-red-500 font-bold">Delete</button></td></tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        // --- 4. ONLINE ORDERS, CANCEL REASON & DELIVERY BOY NUMBER ---
        function renderOrdersTab() {
            return `
                <div class="bg-white p-6 rounded-xl border space-y-4">
                    <h3 class="font-bold text-sm text-slate-800">Online Orders, Cancel Reason & Delivery Boy Number Option</h3>
                    <table class="w-full text-left text-xs">
                        <thead><tr class="border-b bg-slate-50"><th class="p-2">ID</th><th class="p-2">Customer</th><th class="p-2">Item & Qty</th><th class="p-2">Delivery Boy</th><th class="p-2">Status & Reason</th><th class="p-2 text-right">Actions</th></tr></thead>
                        <tbody>
                            ${state.orders.map(o=>`
                                <tr class="border-b">
                                    <td class="p-2 font-bold">#${o.id}</td>
                                    <td class="p-2">${o.customer} (${o.phone})</td>
                                    <td class="p-2">${o.item} (x${o.qty})</td>
                                    <td class="p-2"><input type="text" value="${o.deliveryBoy||''}" onchange="updateDeliveryBoy(${o.id}, this.value)" placeholder="Assign Delivery Boy #" class="border p-1 rounded w-36"></td>
                                    <td class="p-2"><span class="px-2 py-0.5 rounded font-bold ${o.status==='Accepted'?'bg-emerald-100 text-emerald-800':o.status==='Cancelled'?'bg-red-100 text-red-800':'bg-amber-100 text-amber-800'}">${o.status}</span>${o.reason?'<br><span class="text-[10px] text-red-600">Reason: '+o.reason+'</span>':''}</td>
                                    <td class="p-2 text-right space-x-1">
                                        ${o.status==='Pending'?`<button onclick="updateOrderStatus(${o.id}, 'Accepted')" class="bg-emerald-600 text-white px-2 py-1 rounded">Accept</button><button onclick="state.cancellingOrderId=${o.id}; render();" class="bg-red-600 text-white px-2 py-1 rounded">Cancel</button>`:`<button onclick="state.invoiceOrder=${JSON.stringify(o).replace(/"/g, '&quot;')}; render();" class="bg-slate-900 text-white px-2 py-1 rounded">PDF Bill</button>`}
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        // --- 5. 1500+ OFFER FLYERS ---
        function renderFlyerTab() {
            const storeName = state.activeStore ? state.activeStore.name : 'MARKET PRO SUPERMARKET';
            return `
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="bg-white p-6 rounded-xl border space-y-3 h-fit text-xs">
                        <h3 class="font-bold text-sm text-slate-800">1,500+ Offer Flyer Templates Studio</h3>
                        <div><label class="block font-bold text-slate-500 mb-1">Select Template (1 to 1500+)</label><input type="number" min="1" max="1500" value="${state.flyerTemplateId}" oninput="state.flyerTemplateId=this.value; render();" class="w-full border p-2 rounded"></div>
                        <div><label class="block font-bold text-slate-500 mb-1">Print Format</label><select onchange="state.flyerFormat=this.value; render();" class="w-full border p-2 rounded"><option value="A4">A4 Print Standard</option><option value="A3">A3 Large Poster</option><option value="Square">Square (WhatsApp)</option></select></div>
                        <div><label class="block font-bold text-slate-500 mb-1">Headline</label><input type="text" value="${state.flyerTitle}" oninput="state.flyerTitle=this.value; render();" class="w-full border p-2 rounded"></div>
                        <div><label class="block font-bold text-slate-500 mb-1">Sub-Headline</label><input type="text" value="${state.flyerSubtitle}" oninput="state.flyerSubtitle=this.value; render();" class="w-full border p-2 rounded"></div>
                        <button onclick="window.print()" class="w-full bg-teal-700 text-white font-bold py-2.5 rounded shadow">Print / Export Flyer PDF</button>
                    </div>
                    <div class="lg:col-span-2">
                        <div id="printableArea" class="bg-white rounded-xl shadow border-4 border-slate-200 overflow-hidden">
                            <div class="p-6 text-white text-center" style="background:${state.flyerThemeColor}">
                                <span class="bg-yellow-400 text-slate-900 text-[10px] font-black px-3 py-1 rounded-full uppercase">${storeName}</span>
                                <h1 class="text-2xl font-black mt-2 uppercase">${state.flyerTitle}</h1>
                                <p class="text-xs opacity-90 mt-1">${state.flyerSubtitle} • Template #${state.flyerTemplateId} (${state.flyerFormat})</p>
                            </div>
                            <div class="p-6 bg-slate-50 grid grid-cols-2 sm:grid-cols-3 gap-3">
                                ${state.products.map(p=>`
                                    <div class="bg-white border-2 rounded-xl p-3 text-center relative shadow-xs">
                                        <span class="absolute -top-2 right-2 bg-yellow-400 text-slate-900 text-[9px] font-black px-1.5 py-0.5 rounded">SAVE ${state.currency}${(p.mrp-p.price).toFixed(2)}</span>
                                        <div class="text-3xl my-1">${p.image||'📦'}</div>
                                        <h4 class="font-bold text-xs text-slate-900 truncate">${p.name}</h4>
                                        <div class="mt-2 py-1 px-2 text-white rounded inline-block" style="background:${state.flyerThemeColor}">
                                            <span class="text-[9px] line-through">${state.currency}${p.mrp}</span>
                                            <span class="text-base font-black">${state.currency}${p.price}</span>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- 6. SHELF PRICE TAGS ---
        function renderPriceTagsTab() {
            return `
                <div class="bg-white p-6 rounded-xl border space-y-4">
                    <div class="flex justify-between items-center"><h3 class="font-bold text-sm">Shelf Price Tags with Barcode Price</h3><button onclick="window.print()" class="bg-teal-700 text-white px-3 py-1.5 rounded text-xs font-bold">Print Tags</button></div>
                    <div id="printableArea" class="grid grid-cols-2 sm:grid-cols-4 gap-3 bg-slate-50 p-4 border rounded">
                        ${state.products.map(p=>`
                            <div class="border-2 border-dashed border-slate-700 bg-white p-3 rounded text-center">
                                <div class="flex justify-between text-[10px] font-bold text-slate-400 border-b pb-1 mb-1"><span>MARKET PRO</span><span>#${p.barcode}</span></div>
                                <div class="text-2xl">${p.image||'📦'}</div>
                                <h4 class="font-bold text-xs truncate mt-1">${p.name}</h4>
                                <div class="mt-2 flex justify-between items-end"><span class="text-xs line-through text-slate-400">${state.currency}${p.mrp}</span><span class="text-xl font-black text-red-600">${state.currency}${p.price}</span></div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // --- 7. WHOLESALE & EXPIRY ---
        function renderWholesaleTab() {
            return `
                <div class="bg-white p-6 rounded-xl border space-y-4">
                    <h3 class="font-bold text-sm text-slate-800">Wholesale Invoice, Expiry Verification & WhatsApp Offer Messaging</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="p-4 border rounded bg-slate-50 space-y-3">
                            <h4 class="font-bold text-xs">Send Offer Message in WhatsApp Option</h4>
                            <input type="text" placeholder="Customer WhatsApp Number" class="w-full border p-2 rounded text-xs">
                            <textarea placeholder="Type offer message..." class="w-full border p-2 rounded text-xs h-20"></textarea>
                            <button onclick="alert('Offer message sent via WhatsApp API!')" class="w-full bg-emerald-600 text-white font-bold py-2 rounded text-xs">Send WhatsApp Offer</button>
                        </div>
                        <div class="p-4 border rounded bg-slate-50 space-y-3">
                            <h4 class="font-bold text-xs">Expiry Verification Option</h4>
                            <p class="text-xs text-slate-500">Checking product batch expiration dates and safety compliance.</p>
                            <div class="p-3 bg-emerald-100 text-emerald-800 rounded font-bold text-xs">All active product batches are verified & fresh!</div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderCustomerStore() {
            return `
                <div class="min-h-screen bg-slate-100 p-6">
                    <div class="max-w-5xl mx-auto flex justify-between items-center mb-6">
                        <h1 class="font-black text-lg">Market Pro Customer Online Store</h1>
                        <button onclick="switchView('login')" class="bg-teal-700 text-white px-4 py-2 rounded text-xs font-bold">Admin Login</button>
                    </div>
                    <div class="max-w-5xl mx-auto grid grid-cols-1 sm:grid-cols-2 gap-4">
                        ${state.products.map(p=>`
                            <div class="bg-white border p-4 rounded-xl flex justify-between items-center text-xs">
                                <div class="flex items-center space-x-3"><span class="text-3xl">${p.image||'📦'}</span><div><h4 class="font-bold text-sm">${p.name}</h4><p class="text-teal-700 font-bold mt-1">${state.currency}${p.price}</p></div></div>
                                <button onclick="state.orders.unshift({id:Math.floor(100+Math.random()*900), customer:'Online Customer', phone:'Web', item:'${p.name}', price:${p.price}, qty:1, total:${p.price}, status:'Pending', reason:'', deliveryBoy:''}); saveData(); alert('Order Placed Successfully!'); render();" class="bg-teal-700 text-white px-3 py-1.5 rounded font-bold">Order Now</button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function switchView(v) { state.view = v; render(); }
        function logout() { state.currentUser = null; state.isSuperAdmin = false; state.activeStore = null; state.view = 'login'; render(); }

        function createStore() {
            if (!state.newStoreName || !state.newStoreUser || !state.newStorePass) { alert('Fill Shop Name, Username & Password!'); return; }
            state.storesList.push({ id: Date.now(), name: state.newStoreName, logo: state.newStoreLogo, location: state.newStoreLocation, owner: state.newStoreOwner, shopNo: state.newStoreNo, whatsapp: state.newStoreWhatsapp, user: state.newStoreUser, pass: state.newStorePass });
            saveData(); state.newStoreName = ''; state.newStoreLogo = ''; state.newStoreLocation = ''; state.newStoreOwner = ''; state.newStoreNo = ''; state.newStoreWhatsapp = ''; state.newStoreUser = ''; state.newStorePass = '';
            alert('Client store created successfully!'); render();
        }

        function updateOrderStatus(id, status) { const o = state.orders.find(x=>x.id===id); if(o){o.status=status; saveData(); render();} }
        function updateDeliveryBoy(id, val) { const o = state.orders.find(x=>x.id===id); if(o){o.deliveryBoy=val; saveData();} }
        function confirmCancellation() {
            const r = document.getElementById('cancelReasonText')?.value;
            const o = state.orders.find(x=>x.id===state.cancellingOrderId);
            if(o){ o.status='Cancelled'; o.reason=r||'Out of stock'; saveData(); }
            state.cancellingOrderId=null; render();
        }
        function renderCancelModal() {
            return `
                <div class="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
                    <div class="bg-white rounded-xl max-w-md w-full p-6 space-y-3 text-xs">
                        <h3 class="font-bold text-sm">Cancel Order Reason</h3>
                        <textarea id="cancelReasonText" placeholder="Reason..." class="w-full border rounded p-2 h-20 outline-none"></textarea>
                        <div class="flex justify-end space-x-2"><button onclick="state.cancellingOrderId=null; render();" class="px-3 py-1.5 border rounded">Back</button><button onclick="confirmCancellation()" class="px-3 py-1.5 bg-red-600 text-white rounded font-bold">Confirm</button></div>
                    </div>
                </div>
            `;
        }
        function renderPDFModal() {
            const o = state.invoiceOrder;
            return `
                <div class="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
                    <div class="bg-white rounded-xl max-w-md w-full p-6 space-y-3 text-xs">
                        <div id="printableArea" class="p-3 border rounded bg-white"><h2 class="font-black text-sm uppercase">Tax Invoice</h2><p>Order #${o.id}</p><p>${o.item} (x${o.qty}) - ${state.currency}${o.total}</p><p>Delivery Boy: ${o.deliveryBoy||'Not assigned'}</p></div>
                        <div class="flex justify-end space-x-2"><button onclick="state.invoiceOrder=null; render();" class="px-3 py-1.5 border rounded">Close</button><button onclick="window.print()" class="px-3 py-1.5 bg-teal-700 text-white rounded font-bold">Print PDF</button></div>
                    </div>
                </div>
            `;
        }

        function addManualItem() {
            if (!state.newItem.name || !state.newItem.price) { alert('Enter Name & Price'); return; }
            state.products.unshift({ id: Date.now(), barcode: state.newItem.barcode||'890'+Math.floor(100+Math.random()*900), name: state.newItem.name, mrp: parseFloat(state.newItem.mrp)||100, price: parseFloat(state.newItem.price), stock: 50, category: 'General', image: state.newItem.image||'📦' });
            saveData(); state.newItem = { barcode: '', name: '', mrp: '', price: '', image: '🛒' }; alert('Item Added!'); render();
        }

        function downloadCSV() {
            const csv = "data:text/csv;charset=utf-8,barcode,name,mrp,price,category\n890101,Arokya Milk 1L,78,71.40,Dairy\n890102,Tamil Milk 500ml,32,29.50,Dairy";
            const link = document.createElement("a"); link.setAttribute("href", encodeURI(csv)); link.setAttribute("download", "market_pro_db.csv"); document.body.appendChild(link); link.click(); document.body.removeChild(link);
        }

        function uploadCSV(input) {
            const file = input.files[0]; if(!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const lines = e.target.result.split('\n');
                let count = 0;
                for(let i=1; i<lines.length; i++) {
                    const r = lines[i].split(',');
                    if(r.length >= 4) {
                        state.products.push({ id: Date.now()+i, barcode: r[0].trim(), name: r[1].trim(), mrp: parseFloat(r[2])||100, price: parseFloat(r[3])||90, stock: 50, category: 'General', image: '📦' });
                        count++;
                    }
                }
                saveData(); alert(count + ' items imported from CSV database!'); render();
            };
            reader.readAsText(file);
        }

        function addPOS(id) { const p = state.products.find(x=>x.id===id); if(p){const ex=state.posCart.find(x=>x.id===id); if(ex)ex.qty+=1; else state.posCart.push({...p, qty:1}); render();} }
        function completePOS() {
            if(state.posCart.length===0){alert('Cart empty');return;}
            state.posCart.forEach(i=>state.orders.unshift({id:Math.floor(100+Math.random()*900), customer:state.customerName||'Walk-in', phone:state.customerPhone||'Counter', item:i.name, price:i.price, qty:i.qty, total:i.price*i.qty, status:'Accepted', reason:'', deliveryBoy:''}));
            saveData(); state.posCart=[]; alert('POS Bill Completed!'); render();
        }

        render();
    </script>
</body>
</html>
